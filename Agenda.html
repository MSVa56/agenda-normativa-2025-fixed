<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agenda Regulatoria ENARGAS</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
    .login-box, .agenda-box { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; }
    label { display: block; margin-top: 10px; }
    input[type=text], input[type=password], select { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 15px; padding: 10px 15px; background-color: #005baa; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #003f7d; }
    .hidden { display: none; }
    .event { border-bottom: 1px solid #ddd; padding: 10px 0; }
    .event:last-child { border-bottom: none; }
    .event strong { display: block; margin-bottom: 5px; }
    #add-project-form { margin-top: 20px; padding-top: 10px; border-top: 1px solid #ccc; }
    .notice { color: red; margin-top: 10px; }
  </style>
</head>
<body>

<div class="login-box" id="login-box">
  <h2>Ingreso al Sistema</h2>
  <label for="username">Usuario</label>
  <input type="text" id="username">
  <label for="password">Contraseña</label>
  <input type="password" id="password">
  <button onclick="login()">Ingresar</button>
  <div class="notice" id="login-error" style="display:none;">Acceso denegado. Solicite acceso a: <a href="https://soporte.enargas.gob.ar" target="_blank">soporte.enargas.gob.ar</a></div>
</div>

<div class="agenda-box hidden" id="agenda-box">
  <h2>Agenda Regulatoria 2025</h2>

  <label for="gerencia">Gerencia Interviniente</label>
  <select id="gerencia" onchange="mostrarProyecto()">
    <option value="">-- Seleccione una Gerencia --</option>
    <option value="Distribución">Gerencia de Distribución</option>
    <option value="Innovación">Gerencia de Innovación y Normalización</option>
    <option value="Desempeño">Gerencia de Desempeño y Economía</option>
    <option value="Control">Gerencia de Control Económico Regulatorio</option>
    <option value="Transmisión">Gerencia de Transmisión</option>
    <option value="GNC">Gerencia de Gas Natural Vehicular</option>
    <option value="Protección">Gerencia de Protección del Usuario</option>
    <option value="Despacho">Departamento de Despacho de Gas</option>
    <option value="Legales">Gerencia de Asuntos Legales</option>
  </select>

  <div id="proyectos"></div>
  <div id="estadoAvance" class="hidden">
    <h3>Estado de Avance</h3>
    <ul id="estados"></ul>
  </div>

  <div id="add-project-form" class="hidden">
    <h3>Agregar nuevo proyecto</h3>
    <label for="nuevoProyecto">Proyecto</label>
    <input type="text" id="nuevoProyecto">
    <label for="nuevoEstado">Estado de Avance</label>
    <input type="text" id="nuevoEstado">
    <button onclick="agregarProyecto()">Agregar</button>
  </div>
</div>

<script>
const usuariosVer = ["BSuarezTrillo", "MAPonceQuintero", "AMLamban", "fpezzullo", "CODeLaFuente", "GLanzillotti", "MFMartinez", "GABravo", "LMBuisel", "FMBello", "JGDiaz", "SDOnorati", "EOSalomoneStrunz", "DJEchazu", "mesayoni", "CAMCasares"];
const usuariosAgregar = ["BSuarezTrillo", "fpezzullo", "CODeLaFuente", "GLanzillotti", "MFMartinez", "GABravo", "LMBuisel", "FMBello", "JGDiaz", "SDOnorati", "mesayoni", "CAMCasares"];

const proyectosPorGerencia = {
  "Distribución": [
    { nombre: "Revisión de la Resolución I 910/09", estado: "FINALIZADO" },
    { nombre: "Readecuación de la Resolución 35/93", estado: "EN CURSO" },
    { nombre: "Nueva Resolución 226 y Revisores de Internas", estado: "INICIADO" },
    { nombre: "Mejora continua en los Indicadores de Calidad", estado: "PLANIFICADO" }
  ],
  "Innovación": [
    { nombre: "Revisión y readecuación de la Resolución 138/95", estado: "EN CURSO" },
    { nombre: "Normativas técnicas para el segmento del GNL", estado: "INICIADO" },
    { nombre: "Plan de revisión de Normas técnicas obsoletas", estado: "PLANIFICADO" },
    { nombre: "Nueva Resolución 226 y Revisores de Internas", estado: "INICIADO" }
  ],
  "Desempeño": [
    { nombre: "Revisión del criterio de distribución de la Tasa de Fiscalización y Control", estado: "EN CURSO" },
    { nombre: "Mejora continua en los Indicadores de Calidad", estado: "PLANIFICADO" }
  ],
  "Control": [
    { nombre: "Revisión del criterio de distribución de la Tasa de Fiscalización y Control", estado: "INICIADO" },
    { nombre: "Determinación definitiva de las tarifas de transportistas no licenciatarios", estado: "EN CURSO" },
    { nombre: "Mejora continua en los Indicadores de Calidad", estado: "PLANIFICADO" }
  ],
  "Transmisión": [
    { nombre: "Determinación definitiva de las tarifas de transportistas no licenciatarios", estado: "FINALIZADO" },
    { nombre: "Mejora continua en los Indicadores de Calidad", estado: "PLANIFICADO" }
  ],
  "GNC": [
    { nombre: "Digitalización de revisión del parque automotor GNC", estado: "EN CURSO" }
  ],
  "Protección": [
    { nombre: "Migrar a facturas y comunicaciones digitales", estado: "INICIADO" }
  ],
  "Despacho": [
    { nombre: "Revisión del proyecto NAG 601 Normas de Despacho de Gas", estado: "FINALIZADO" }
  ],
  "Legales": []
};

let usuarioActivo = "";

function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;
  if (p === "ENAR-AGENDA" && usuariosVer.includes(u)) {
    usuarioActivo = u;
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("agenda-box").classList.remove("hidden");
    if (usuariosAgregar.includes(u)) {
      document.getElementById("add-project-form").classList.remove("hidden");
    }
    document.getElementById("estadoAvance").classList.remove("hidden");
  } else {
    document.getElementById("login-error").style.display = "block";
  }
}

function mostrarProyecto() {
  const g = document.getElementById("gerencia").value;
  const cont = document.getElementById("proyectos");
  const est = document.getElementById("estados");
  cont.innerHTML = "";
  est.innerHTML = "";
  if (g && proyectosPorGerencia[g]) {
    proyectosPorGerencia[g].forEach(p => {
      cont.innerHTML += `<div class='event'><strong>${p.nombre}</strong></div>`;
      if (!document.getElementById("estadoAvance").classList.contains("hidden")) {
        est.innerHTML += `<li>${p.nombre}: <strong>${p.estado}</strong></li>`;
      }
    });
  }
}

function agregarProyecto() {
  const g = document.getElementById("gerencia").value;
  const nombre = document.getElementById("nuevoProyecto").value;
  const estado = document.getElementById("nuevoEstado").value;
  if (g && nombre && estado) {
    proyectosPorGerencia[g].push({ nombre, estado });
    mostrarProyecto();
    document.getElementById("nuevoProyecto").value = "";
    document.getElementById("nuevoEstado").value = "";
  } else {
    alert("Por favor complete todos los campos.");
  }
}
</script>

</body>
</html>
